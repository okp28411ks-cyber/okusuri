<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>製品登録</title>

<style>

body {
  font-family: sans-serif;
  max-width: 500px;
  margin: 30px auto;
  padding: 20px;
}

h1 {
  text-align: center;
}

label {
  display:block;
  margin-top:15px;
}

input, textarea {
  width:100%;
  padding:12px;
  font-size:16px;
  box-sizing:border-box;
}

textarea {
  height:100px;
}

button {
  margin-top:25px;
  width:100%;
  padding:15px;
  font-size:18px;
  cursor:pointer;
}

#result {
  margin-top:20px;
  font-size:20px;
  text-align:center;
}

</style>

</head>

<body>

<h1>製品登録</h1>
<div id="userInfo"></div>

<button onclick="logout()">
ログアウト
</button>

<label>製品名（必須）</label>
<input id="product_name">


<label>製薬会社</label>
<input id="company">


<label>ロット番号</label>
<input id="lot_number">


<label>備考</label>
<textarea id="note"></textarea>


<button onclick="register()">
登録する
</button>


<div id="result"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://nmstudwvvmbttfhanuyu.supabase.co";
const supabaseKey = "sb_publishable_DagUSgICo4JTVxwimcZKDw_NYBHPzSf";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);
  // ログイン確認とユーザー表示
async function checkUser(){

const {data} = await client.auth.getSession();


if(!data.session){

location.href="login.html";

return;

}


document.getElementById("userInfo").innerHTML =
"ログイン中：" + data.session.user.email;

}


checkUser();


// ログアウト
async function logout(){

await client.auth.signOut();

location.href="login.html";

}
// ログイン確認
async function checkLogin(){

  const { data } = await client.auth.getSession();

  if(!data.session){

    location.href = "login.html";

  }

}

checkLogin();

async function register(){

const product_name =
document.getElementById("product_name").value;


if(product_name === ""){
 alert("製品名を入力してください");
 return;
}


const { data, error } = await client
.from("items")
.insert([
{
product_name:
product_name,

company:
document.getElementById("company").value,

lot_number:
document.getElementById("lot_number").value,

note:
document.getElementById("note").value
}
])
.select();


if(error){

document.getElementById("result").innerHTML =
"エラー：" + error.message;

return;

}


document.getElementById("result").innerHTML =

"登録完了！<br><br>" +

"製品番号：" + data[0].id;

}

</script>


</body>
</html>
