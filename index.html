<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>確認ページ</title>
</head>

<body>

<h1>確認</h1>
<div id="result">確認中...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "あなたのAPI URL";
const supabaseKey = "あなたのPublishable key";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

async function test(){

const { data, error } = await client
.from("items")
.select("*");

if(error){
 document.getElementById("result").innerHTML =
 "エラー：" + error.message;
 return;
}

document.getElementById("result").innerHTML =
JSON.stringify(data);

}

test();

</script>

</body>
</html>
