<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>製品情報</title>
</head>

<body>

<h1>製品情報</h1>

<div id="result">読み込み中...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://nmstudwvvmbttfhanuyu.supabase.co";
const supabaseKey = "sb_publishable_DagUSgICo4JTVxwimcZKDw_NYBHPzSf";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const id = location.pathname.replace("/", "");

async function loadData(){

  const { data, error } = await client
    .from("items")
    .select("*")
    .eq("id", id)
    .single();

  if(error){
    document.getElementById("result").innerHTML =
      "データがありません";
    return;
  }

  document.getElementById("result").innerHTML = `
    <p>番号：${data.id}</p>
    <p>製品名：${data.product_name}</p>
    <p>製薬会社：${data.company}</p>
    <p>ロット番号：${data.lot_number}</p>
    <p>備考：${data.note}</p>
  `;

}

loadData();

</script>

</body>
</html>
