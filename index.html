<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>番号ページ</title>
</head>

<body>

<h1>番号ページ</h1>
<div id="result">読み込み中...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabaseUrl = "https://nmstudwvvmbttfhanuyu.supabase.co";
const supabaseKey = "sb_publishable_DagUSgICo4JTVxwimcZKDw_NYBHPzSf";

const client = supabase.createClient(
  supabaseUrl,
  supabaseKey
);

const id = location.pathname.replace("/", "");

async function loadData(){

  const { data, error } = await client
    .from("items")
    .select("*")
    .eq("id", id)
    .single();

  if(error){
    document.getElementById("result").innerHTML =
      "エラー：" + error.message;
    return;
  }

  document.getElementById("result").innerHTML =
    "番号：" + data.id + "<br>" +
    "名前：" + data.name;

}

loadData();

</script>

</body>
</html>
